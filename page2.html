<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>picture with button</title>
    <style>
        .container {
            position: relative;
            display: inline-block;
        }
        .image {
            width: 500px;
            height: auto;
        }
        .button {
            position: absolute;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            cursor: pointer;
        }
        .button1 { top: 20%; left: 30%; }
        .button2 { top: 50%; left: 60%; }
    </style>
</head>
<body>
    <div class="container">
        <img src="p2.png" alt="example" class="image">
    </div>
</body>
</html>
